[project]
name = "canopy-apns"
version = "1.0.0"
description = "A stateless APNs forwarder for self-hosted Canopy+ instances"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # APNs speaks HTTP/2 only, hence the extra; `cryptography` signs the ES256
    # provider token. Between them they are the whole of what this service does.
    "httpx[http2]>=0.28",
    "cryptography>=42",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy_apns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
